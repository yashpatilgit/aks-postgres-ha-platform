apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-cluster
spec:
  instances: 3
  storage:
    storageClass: managed-csi-premium
    size: 10Gi
  bootstrap:
    initdb:
      database: appdb
      owner: appuser
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  affinity:
    podAntiAffinityType: preferred
